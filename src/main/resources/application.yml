server:
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: demo
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/amigoscode}
    username: ${SPRING_DATASOURCE_USERNAME:app_user}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      max-lifetime: 270000
      keepalive-time: 60000
      idle-timeout: 180000
      connection-test-query: SELECT 1
      validation-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}

  cache:
    type: redis
    redis:
      time-to-live: 600000 # 10 minutes in milliseconds

demo:
  app:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    http:
      connect-timeout: ${HTTP_CONNECT_TIMEOUT_MS:2000}
      read-timeout: ${HTTP_READ_TIMEOUT_MS:3000}
    sms:
      enabled: ${SMS_ENABLED:false}
      url: ${SMS_URL:https://example.invalid/sms}

# pagination moved to Spring's pageable settings under spring.data.web.pageable
