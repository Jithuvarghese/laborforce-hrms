server:
  error:
    include-message: always
    include-binding-errors: always

spring:
  datasource:
    url: ${SUPABASE_URL:jdbc:postgresql://localhost:5432/amigoscode}
    username: ${SUPABASE_USERNAME:postgres}
    password: ${SUPABASE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      max-lifetime: 270000
      keepalive-time: 60000
      idle-timeout: 180000
      connection-test-query: SELECT 1
      validation-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        generate_statistics: true

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  cache:
    type: redis

redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  timeout: 2000ms
  connect-timeout: 2000ms
  jedis:
    pool:
      max-active: 8
      max-idle: 8
      min-idle: 0

cache:
  redis:
    time-to-live: 600000 # 10 minutes in milliseconds

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

pagination:
  default-page-size: 20
  max-page-size: 100
server:
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: demo
  datasource:
    url: jdbc:postgresql://localhost:5432/amigoscode
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s

hrms:
  pagination:
    default-page-size: 20
    max-page-size: 100
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://127.0.0.1:3000
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - '*'
    allow-credentials: true
  redis:
    ttl: 10m